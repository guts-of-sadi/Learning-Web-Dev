<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            display: inline-block;
            border: 2px solid black;
            padding: 14px;
            border-radius: 10px;
            box-shadow: 10px 10px 5px grey;
            text-shadow: 11px 9px 4px  palevioletred;

        }
        p{
            display: inline-block;
            font-size: 20px;
            color:darkcyan;
            text-shadow: 12px 11px 7px #2a1452;
            border: 2px dashed darkcyan;
            padding: 10px ;
            margin: 33px;
            border-radius: 10px;
            outline: 2px solid black;
            outline-offset: 20px;

        }
    </style>
</head>

<body>
    <div>
        This is optimus prime.
    </div>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Non, quibusdam? Perferendis, adipisci!
    </p>
</body>

</html>
